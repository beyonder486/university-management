name: Intentional Failure Demo

on:
  workflow_dispatch:

jobs:
  demonstrate-failure:
    name: Run intentionally failing test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run the intentionally failing test
        run: mvn --batch-mode --no-transfer-progress -Dtest=IntentionalFailureDemo test
