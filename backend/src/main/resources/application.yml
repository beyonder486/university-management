server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/university_db
    username: university
    password: university
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    user:
      name: admin
      password: admin

jwt:
  secret: ${JWT_SECRET:c2VjcmV0LXN0cmluZy1mb3ItdW5pdmVyc2l0eS1tYW5hZ2VtZW50LXByb2plY3Q=}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
